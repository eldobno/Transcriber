[package]
name = "transcriber"
version = "0.1.0"
description = "Local-first desktop transcription application"
authors = ["Eldho Beno"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "transcriber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.4.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sysinfo = "0.30"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

httparse = "1.10"
getrandom = "0.3"
tempfile = "3"
regex = "1"

chrono = { version = "0.4", features = ["serde"] }

reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

encoding_rs = "0.8"
sha2 = "0.10"
keyring = "2.1"
rusqlite = { version = "0.32", features = ["bundled"] }
hound = "3.5"
# Pin the tested upstream 0.6.0 commit. Published 0.5.0 could request a split-tail
# ONNX asset its ModelManager did not provision; this revision contains the fixed
# asset-inventory loader used by the validated CUDA diarization path.
speakrs = { git = "https://github.com/avencera/speakrs.git", rev = "ab98f358420aa0bc238326631359dd5b351f74b2", features = ["cuda"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
