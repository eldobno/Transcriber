<!doctype html>
<html lang="en" class="booting">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Transcriber</title>

  <style>
    :root {
      background: #0a0c10;
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0a0c10;
    }

    #app {
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
    }

    html.app-ready #app {
      opacity: 1;
      visibility: visible;
      transition: opacity 240ms cubic-bezier(.2,.8,.2,1);
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
      pointer-events: auto;
      background:
        radial-gradient(circle at 50% 46%, rgba(54, 196, 221, .065), transparent 26%),
        radial-gradient(circle at 50% 54%, rgba(255, 191, 52, .045), transparent 34%),
        #0a0c10;
      opacity: 1;
      visibility: visible;
      transition: opacity 300ms ease, visibility 300ms ease;
    }

    #boot-splash::before {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.035), rgba(255,255,255,0) 68%);
      filter: blur(4px);
      animation: boot-breathe 1.6s ease-in-out infinite alternate;
    }

    #boot-splash.leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-lockup {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 15px;
      transform: translateY(-3px);
      will-change: transform, opacity;
    }

    .boot-mark-wrap {
      position: relative;
      width: 66px;
      height: 66px;
      flex: none;
      display: grid;
      place-items: center;
      transform: translateX(48px) scale(.88);
      opacity: 0;
      animation: boot-mark-in 720ms cubic-bezier(.16,1,.3,1) 70ms forwards;
    }

    .boot-mark-wrap::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.06);
      opacity: 0;
      transform: scale(.76);
      animation: boot-ring 850ms cubic-bezier(.16,1,.3,1) 160ms forwards;
    }

    .boot-mark {
      width: 66px;
      height: 66px;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,.35));
    }

    .boot-word-mask {
      overflow: hidden;
      clip-path: inset(0 100% 0 0);
      opacity: 0;
      animation: boot-word-reveal 680ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }

    .boot-word {
      display: block;
      color: #f5f7fa;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.035em;
      white-space: nowrap;
      transform: translateX(-14px);
      opacity: 0;
      animation: boot-word-drift 680ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }

    #boot-splash.leaving .boot-lockup {
      opacity: 0;
      transform: translateY(-3px) scale(.985);
      transition: opacity 220ms ease, transform 240ms cubic-bezier(.2,.8,.2,1);
    }

    @keyframes boot-mark-in {
      0% { opacity: 0; transform: translateX(48px) scale(.88) rotate(-8deg); }
      32% { opacity: 1; }
      100% { opacity: 1; transform: translateX(0) scale(1) rotate(0); }
    }

    @keyframes boot-word-reveal {
      0% { opacity: 0; clip-path: inset(0 100% 0 0); }
      25% { opacity: 1; }
      100% { opacity: 1; clip-path: inset(0 0 0 0); }
    }

    @keyframes boot-word-drift {
      0% { opacity: 0; transform: translateX(-14px); }
      35% { opacity: 1; }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes boot-ring {
      0% { opacity: 0; transform: scale(.76); }
      42% { opacity: .5; }
      100% { opacity: 0; transform: scale(1.18); }
    }

    @keyframes boot-breathe {
      from { transform: scale(.92); opacity: .6; }
      to { transform: scale(1.08); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot-splash::before,
      .boot-mark-wrap,
      .boot-mark-wrap::after,
      .boot-word-mask,
      .boot-word {
        animation: none !important;
      }

      .boot-mark-wrap,
      .boot-word-mask,
      .boot-word {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
      }

      #boot-splash {
        transition-duration: 90ms !important;
      }
    }
  </style>

  <script>
    window.__transcriberBootStarted = performance.now();
    window.__transcriberBootFailsafe = window.setTimeout(() => {
      document.documentElement.classList.add('app-ready');
      const splash = document.getElementById('boot-splash');
      if (splash) {
        splash.classList.add('leaving');
        window.setTimeout(() => splash.remove(), 360);
      }
    }, 5000);
  </script>

  <script type="module" src="/src/main.ts" defer></script>
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-lockup">
      <div class="boot-mark-wrap">
        <img class="boot-mark" src="/src/assets/app-icon.png" alt="" />
      </div>
      <div class="boot-word-mask">
        <span class="boot-word">Transcriber</span>
      </div>
    </div>
  </div>
  <div id="app"></div>
</body>
</html>
